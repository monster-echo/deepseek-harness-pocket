name: desktop-tauri-release

# 桌面端（Tauri 2）发布：tag desktop-v<版本> 触发，或手动 dispatch。
# 产物：macOS dmg + .app.tar.gz(+sig)、Windows NSIS setup + nsis.zip(+sig)、latest.json。
#
# 触发标签 desktop-v<版本>（原 Flutter 流水线已移除，本流水线接管该前缀）。
#
# 需要的 GitHub Secrets（一次性配置）：
#   TAURI_SIGNING_PRIVATE_KEY           ~/.tauri/dsh-pocket.key 的内容
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  该私钥的密码（本项目生成时为空，可留空）
#   APPLE_CERTIFICATE                   Developer ID Application 证书的 .p12（base64）
#   APPLE_CERTIFICATE_PASSWORD          该 .p12 的导出密码
#   APPLE_ID / APPLE_PASSWORD           公证用 Apple ID + App 专用密码（未配则跳过公证，仅签名）
#   APPLE_TEAM_ID 无需 secret，已在下方固定为 2VA9TC6SG4

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.1.9，需与 tauri.conf.json version 一致）'
        required: true

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
            bundle_glob: src-tauri/target/release/bundle
          - os: windows-latest
            target: windows-x64
            bundle_glob: src-tauri/target/release/bundle
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Windows 默认 shell 是 pwsh，跑不了 .sh（sidecar 脚本）；统一用 bash
        shell: bash
        working-directory: desktop-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri

      - name: Install workspace deps
        working-directory: .
        run: pnpm install --frozen-lockfile

      # v0.2.0 起不再打包 node-sidecar：Node/bridge 由首次引导从网络组装
      # （见 src-tauri/src/toolchain.rs），CI 也无需再跑 build-sidecar.sh。

      - name: Verify version consistency
        # tauri.conf.json 的 version 决定更新器比对基准。若 tag 与它不一致，
        # 会出现「更新后版本号没变 → 又被提示更新」的无限循环。
        # 用 node 而不是 python3：Windows runner 上 python3 别名不可靠。
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            WANT="${{ github.event.inputs.version }}"
          else
            WANT="${GITHUB_REF_NAME#desktop-v}"
          fi
          HAVE=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tag=$WANT conf=$HAVE cargo=$CARGO"
          [ "$WANT" = "$HAVE" ] || { echo "::error::tag 版本 $WANT 与 tauri.conf.json 的 $HAVE 不一致"; exit 1; }
          [ "$HAVE" = "$CARGO" ] || { echo "::error::tauri.conf.json 的 $HAVE 与 Cargo.toml 的 $CARGO 不一致"; exit 1; }

      # Apple 签名/公证凭据只在 macOS 腿上通过 GITHUB_ENV 注入。
      # 证书 secrets 缺失则产物保持未签名（老行为）；公证 secrets 缺失则只签名不公证，
      # 不能给 Tauri 留半套空变量——bundler 检测到部分设置会直接报错。
      - name: Setup Apple signing env (macOS)
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=Developer ID Application: Zhenwei Ruan (2VA9TC6SG4)"
            echo "APPLE_TEAM_ID=2VA9TC6SG4"
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ]; then
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            else
              echo "::warning::APPLE_ID / APPLE_PASSWORD secrets 未配置，本次产物签名但跳过公证"
            fi
          } >> "$GITHUB_ENV"

      - name: Build app (tauri)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      # release 作业要靠这些 artifact 组装 Release 与 latest.json（缺了会空跑失败）。
      # 注意 upload-artifact 的路径相对仓库根（不受 working-directory 影响），须带 desktop-tauri/ 前缀
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-tauri-${{ matrix.target }}
          path: |
            desktop-tauri/${{ matrix.bundle_glob }}/dmg/*.dmg
            desktop-tauri/${{ matrix.bundle_glob }}/macos/*.app.tar.gz
            desktop-tauri/${{ matrix.bundle_glob }}/macos/*.app.tar.gz.sig
            desktop-tauri/${{ matrix.bundle_glob }}/nsis/*-setup.exe
            desktop-tauri/${{ matrix.bundle_glob }}/nsis/*-setup.exe.sig
            desktop-tauri/${{ matrix.bundle_glob }}/nsis/*.nsis.zip
            desktop-tauri/${{ matrix.bundle_glob }}/nsis/*.nsis.zip.sig
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # make-latest-json.py 在仓库里，release 工作区默认没有代码，必须先 checkout
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#desktop-v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本: $V"

      # 顺序很重要：先建 Release 传安装包，再生成 latest.json——
      # 脚本以 Release 上的真实资产名为准（upload-artifact 会把文件名里的空格消毒成点，
      # 按本地名拼 URL 会 404，v0.1.9 的真实事故），所以必须先有 Release 才能查资产名。
      - name: Create release（上传安装包）
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then TAG="desktop-v$VERSION"; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          gh release create "$TAG" \
            --title "DSH Pocket 桌面端 $VERSION（Tauri）" \
            --generate-notes \
            dist/*.dmg \
            dist/*.app.tar.gz \
            dist/*.app.tar.gz.sig \
            dist/*-setup.exe \
            dist/*.exe.sig

      - name: Generate latest.json（以 Release 真实资产名为准）
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          REPO: ${{ github.repository }}
          TAG: ${{ env.TAG }}
        run: python3 .github/scripts/make-latest-json.py

      - name: Upload latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" --clobber dist/latest.json
