[package]
name = "dsh-pocket"
version = "0.2.10"
description = "DSH Pocket — DeepSeek Harness 桌面 Worker"
authors = ["掌鲸 DSH Pocket"]
edition = "2021"

[lib]
name = "dsh_pocket_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
# About 弹窗等原生对话框
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
uuid = { version = "1", features = ["v4"] }
# 账号续期走 HTTPS（updater 已带此依赖，特征统一后无额外编译量）
reqwest = { version = "0.13", default-features = false, features = ["json", "blocking", "rustls-no-provider", "system-proxy"] }
# 显式自带 TLS provider，不依赖 updater 的特征并集
rustls = { version = "0.23", features = ["ring"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 运行时引导（下载并解压 Node 发行版）：四个包都已在依赖树里（tauri 传递），零新增编译量
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "4", default-features = false, features = ["deflate"] }

# tauri mock runtime：集成测试里构造 AppHandle（emit 进度事件无副作用）。
# Windows 上启用 test feature 会让整个测试 exe 加载失败（STATUS_ENTRYPOINT_NOT_FOUND，
# 0xc0000139，webview2 loader 入口解析不出），故仅非 Windows 测试主机启用；
# bootstrap_e2e_tests 模块以同一 cfg 圈起，Windows CI 仍跑全部纯逻辑测试。
[target.'cfg(not(target_os = "windows"))'.dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
