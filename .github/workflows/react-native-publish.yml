name: React Native Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-native
    env:
      # Optional: base64-encoded release keystore. When unset, the release APK
      # is signed with the debug keys (still installable for testing).
      RN_KEYSTORE: ${{ secrets.RN_KEYSTORE }}
      # Optional: base64-encoded real google-services.json. When unset, a minimal
      # placeholder is generated so the Firebase Gradle plugin builds; Firebase is
      # inert at runtime without a real file.
      RN_GOOGLE_SERVICES_JSON: ${{ secrets.RN_GOOGLE_SERVICES_JSON }}
      # 发布身份（必填）：app_id（租户）与 environment。Expo 在构建期把
      # EXPO_PUBLIC_* 内联进产物，未配置则构建出的 App 启动即崩。
      # 取值优先 GitHub Variables，其次 Secrets；environment 发布默认 production。
      EXPO_PUBLIC_APP_ID: ${{ vars.APP_ID || secrets.APP_ID }}
      EXPO_PUBLIC_APP_ENVIRONMENT: ${{ vars.APP_ENVIRONMENT || secrets.APP_ENVIRONMENT || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: react-native/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci --legacy-peer-deps
      - name: Verify app identity
        run: |
          if [ -z "$EXPO_PUBLIC_APP_ID" ]; then
            echo "::error::APP_ID 未配置：请在仓库 Variables 或 Secrets 中设置 APP_ID 后再发布，不能为空。"
            exit 1
          fi
          echo "Publishing app_id=$EXPO_PUBLIC_APP_ID environment=$EXPO_PUBLIC_APP_ENVIRONMENT"
      - name: Provide google-services.json
        # Written to the project root BEFORE prebuild: the @react-native-firebase
        # config plugin copies it into android/app/ during prebuild, and errors if
        # expo.android.googleServicesFile is unset or the file is missing.
        run: |
          if [ -n "$RN_GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$RN_GOOGLE_SERVICES_JSON" | base64 -d > google-services.json
          else
            printf '%s' '{"project_info":{"project_number":"000000000000","project_id":"placeholder"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.mobileui.mobilestarter"}},"oauth_client":[],"api_key":[{"current_key":"placeholder"}],"services":{}}],"configuration_version":"1"}' > google-services.json
          fi
      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Configure signing
        env:
          STORE_PASSWORD: ${{ secrets.RN_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RN_KEY_PASSWORD }}
        run: |
          if [ -n "$RN_KEYSTORE" ]; then
            printf '%s' "$RN_KEYSTORE" | base64 -d > android/app/release.keystore
            printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          fi
          # Leading "\n" guards against the generated file ending without a
          # trailing newline, which would otherwise concatenate onto the last line.
          printf '\napply from: "${rootProject.projectDir}/../ci-release-signing.gradle"\n' >> android/app/build.gradle
      - name: Build release APK
        working-directory: react-native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: react-native-apk
          path: react-native/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
