name: desktop-tauri-release

# 桌面端（Tauri 2）发布：tag desktop-v<版本> 触发，或手动 dispatch。
# 产物：macOS dmg + .app.tar.gz(+sig)、Windows NSIS setup + nsis.zip(+sig)、latest.json。
#
# 触发标签 desktop-v<版本>（原 Flutter 流水线已移除，本流水线接管该前缀）。
#
# 需要的 GitHub Secrets（一次性配置）：
#   TAURI_SIGNING_PRIVATE_KEY           ~/.tauri/dsh-pocket.key 的内容
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  该私钥的密码（本项目生成时为空，可留空）

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.1.9，需与 tauri.conf.json version 一致）'
        required: true

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
            bundle_glob: src-tauri/target/release/bundle
          - os: windows-latest
            target: windows-x64
            bundle_glob: src-tauri/target/release/bundle
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Windows 默认 shell 是 pwsh，跑不了 .sh（sidecar 脚本）；统一用 bash
        shell: bash
        working-directory: desktop-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri

      - name: Install workspace deps
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build sidecar (node + dshc)
        # CI 无预置产物，脚本会自行拉 node 并构建 bridge
        env:
          NODE_MIRROR: https://nodejs.org/dist
          NPM_REGISTRY: https://registry.npmjs.org
        run: ./tool/build-sidecar.sh ${{ matrix.target }}

      - name: Verify version consistency
        # tauri.conf.json 的 version 决定更新器比对基准。若 tag 与它不一致，
        # 会出现「更新后版本号没变 → 又被提示更新」的无限循环。
        # 用 node 而不是 python3：Windows runner 上 python3 别名不可靠。
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            WANT="${{ github.event.inputs.version }}"
          else
            WANT="${GITHUB_REF_NAME#desktop-v}"
          fi
          HAVE=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tag=$WANT conf=$HAVE cargo=$CARGO"
          [ "$WANT" = "$HAVE" ] || { echo "::error::tag 版本 $WANT 与 tauri.conf.json 的 $HAVE 不一致"; exit 1; }
          [ "$HAVE" = "$CARGO" ] || { echo "::error::tauri.conf.json 的 $HAVE 与 Cargo.toml 的 $CARGO 不一致"; exit 1; }

      - name: Build app (tauri)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      # release 作业要靠这些 artifact 组装 Release 与 latest.json（缺了会空跑失败）。
      # 注意 upload-artifact 的路径相对仓库根（不受 working-directory 影响），须带 desktop-tauri/ 前缀
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-tauri-${{ matrix.target }}
          path: |
            desktop-tauri/${{ matrix.bundle_glob }}/dmg/*.dmg
            desktop-tauri/${{ matrix.bundle_glob }}/macos/*.app.tar.gz
            desktop-tauri/${{ matrix.bundle_glob }}/macos/*.app.tar.gz.sig
            desktop-tauri/${{ matrix.bundle_glob }}/nsis/*-setup.exe
            desktop-tauri/${{ matrix.bundle_glob }}/nsis/*-setup.exe.sig
            desktop-tauri/${{ matrix.bundle_glob }}/nsis/*.nsis.zip
            desktop-tauri/${{ matrix.bundle_glob }}/nsis/*.nsis.zip.sig
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # make-latest-json.py 在仓库里，release 工作区默认没有代码，必须先 checkout
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#desktop-v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本: $V"

      - name: Generate latest.json
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/make-latest-json.py

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then TAG="desktop-v$VERSION"; fi
          gh release create "$TAG" \
            --title "DSH Pocket 桌面端 $VERSION（Tauri）" \
            --generate-notes \
            dist/*.dmg \
            dist/*.app.tar.gz \
            dist/*.app.tar.gz.sig \
            dist/*-setup.exe \
            dist/*.exe.sig \
            dist/latest.json
