name: bridge-release

# Bridge (dshc) release: triggered by tag `bridge-v<version>` or manual dispatch.
# Artifact: the public npm package @deepseek-harness-pocket/bridge — since v0.2.0 the
# desktop installer no longer bundles the worker CLI; the app installs it from npm
# during first-run onboarding.
#
# Auth: npm **trusted publishing** (OIDC) — no NPM_TOKEN secret involved.
#   Requires: `id-token: write` permission, npm CLI >= 11.5.1 (bundled with Node 24,
#   we also upgrade npm explicitly), and the package's trusted-publisher config on
#   npmjs.com pointing at this repo + this workflow filename.
# The `repository` field in packages/bridge/package.json must match this repo
# (provenance requirement).

on:
  push:
    tags: ['bridge-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.1, must match packages/bridge/package.json)'
        required: true

concurrency:
  group: bridge-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

env:
  NODE_VERSION: '24'

jobs:
  publish:
    name: Test + build + publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
      # OIDC trusted publishing needs npm >= 11.5.1; upgrade to be safe on any runner image
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile=false

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#bridge-v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Verify version consistency
        run: |
          PKG="$(node -p "require('./packages/bridge/package.json').version")"
          if [ "$PKG" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::tag version (${{ steps.ver.outputs.version }}) != packages/bridge/package.json version ($PKG)"
            exit 1
          fi

      - name: Test
        run: |
          pnpm --filter @deepseek-harness-pocket/bridge-protocol build
          pnpm --filter @deepseek-harness-pocket/bridge test
          pnpm --filter @deepseek-harness-pocket/bridge typecheck

      - name: Build
        run: pnpm --filter @deepseek-harness-pocket/bridge build

      - name: Publish (OIDC, no token)
        working-directory: packages/bridge
        # npm cannot resolve pnpm's `workspace:*` devDependencies; they are build/test-only
        # and the published tarball only ships `files: ["dist"]`, so strip them first.
        run: |
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            delete pkg.devDependencies;
            delete pkg.scripts;
            fs.writeFileSync("package.json", JSON.stringify(pkg, undefined, 2) + "\n");
          '
          npm publish --provenance --access public

      - name: Summary
        run: |
          {
            echo "### @deepseek-harness-pocket/bridge ${{ steps.ver.outputs.version }}"
            echo ""
            echo "- npm: https://www.npmjs.com/package/@deepseek-harness-pocket/bridge"
            echo "- npmmirror sync: https://npmmirror.com/package/@deepseek-harness-pocket/bridge"
          } >> "$GITHUB_STEP_SUMMARY"
